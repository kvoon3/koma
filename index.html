<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>koma</title>
    <script>
      try {
        var t = localStorage.getItem('theme')
        var legacy = localStorage.getItem('collage:theme')
        if ((t == null || (t !== 'dark' && t !== 'light' && t !== 'auto')) && (legacy === 'dark' || legacy === 'light' || legacy === 'auto')) {
          localStorage.setItem('theme', legacy)
          t = legacy
        }
        localStorage.removeItem('collage:theme')
        var os = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', t === 'dark' || (t !== 'light' && os))
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
