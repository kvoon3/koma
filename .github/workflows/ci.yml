# Lint, type-check, build and test every PR, and `main` on every push.
#
# `bun run ci` runs the same three scripts locally, in parallel on one machine.
#
# ESLint is the only gate that keeps a cache: `--cache --cache-strategy content`
# turns 11.7s of work into 3.0s, keyed on the commit so every run saves its own
# snapshot and the next one restores it by prefix. The bun download cache is
# not restored: 7s to restore it against the 3s it saves on `bun install`.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancels the in-flight run for the same PR (or branch, on push) as soon as a
# new commit arrives, so only the latest commit is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      # One runner per gate, so a failing gate never cancels its siblings.
      fail-fast: false
      matrix:
        # `test` asserts wall-clock budgets (an 80ms pixel-filter frame), so it
        # gets a machine to itself instead of sharing four vCPUs with ESLint's
        # single worker and the bundler. `build` type-checks before Vite runs.
        gate: [lint, test, build]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # package.json `packageManager` pins the version. `latest` skips
          # setup-bun's binary cache; a pinned version restores it.
          bun-version-file: package.json

      - uses: actions/cache@v4
        if: matrix.gate == 'lint'
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - run: bun install --frozen-lockfile

      - run: bun run ${{ matrix.gate }}
