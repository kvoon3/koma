# Posts (or updates) one sticky PR comment with the Cloudflare Workers preview
# URL. Workers Builds only links to the dashboard, and the
# cloudflare-workers-and-pages bot sometimes never comments, so we compute the
# deterministic URL ourselves:
#   https://<branch-slug>-koma.kvoon.workers.dev
# where the slug is the head branch lowercased with `/` turned into `-`.
#
# No extra secrets: GITHUB_TOKEN can comment, and the URL needs none.

name: Preview URL comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-url-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Compute preview URL and upsert sticky comment
        uses: actions/github-script@v9
        with:
          script: |
            const MARKER = '<!-- koma-preview-url -->'
            const branch = context.payload.pull_request.head.ref
            const slug = branch.toLowerCase().replace(/\//g, '-')
            const url = `https://${slug}-koma.kvoon.workers.dev`
            const sha = context.payload.pull_request.head.sha.slice(0, 7)

            // Poll until the preview answers 200 (CF build finished) or we time out.
            // Comment either way so the PR always has a sticky link.
            const deadline = Date.now() + 3 * 60 * 1000
            let live = false
            let lastStatus = 'unreachable'
            while (Date.now() < deadline) {
              try {
                const res = await fetch(url, { method: 'GET', redirect: 'follow' })
                lastStatus = String(res.status)
                if (res.status === 200) {
                  live = true
                  break
                }
              } catch (err) {
                lastStatus = err instanceof Error ? err.message : String(err)
              }
              await new Promise(r => setTimeout(r, 5000))
            }

            const statusLine = live
              ? `Preview is up (commit \`${sha}\`).`
              : `Preview URL ready — Cloudflare build may still be running (last check: ${lastStatus}, commit \`${sha}\`).`

            const body = [
              MARKER,
              '## Cloudflare preview',
              '',
              `**Preview URL:** ${url}`,
              '',
              statusLine,
              '',
              `_Branch \`${branch}\` → \`${slug}-koma.kvoon.workers.dev\`_`,
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes(MARKER)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              core.info(`Updated sticky preview comment ${existing.id}`)
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
              core.info('Created sticky preview comment')
            }
