name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # The void build emits dist/client, dist/ssr and dist/ssr/wrangler.json:
      # a complete wrangler config with the Worker entry, the ASSETS binding,
      # the custom domain and the account.
      - name: Build the void shape
        run: bun run build:void

      # Deploy with wrangler, not `void deploy`: void 1.3.0 borrows the bearer
      # for its version-aware uploader from wrangler's `auth.token`, and on a
      # headless runner that borrow fails ("Cloudflare session has no bearer
      # for version-aware upload", voidzero-dev/void#627), so nothing uploads.
      # Wrangler reads CLOUDFLARE_API_TOKEN directly and keeps the Worker's
      # secrets (keepSecrets: true), which void's upload patch does not.
      - name: Deploy the generated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --config dist/ssr/wrangler.json
